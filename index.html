<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Isométrico PWA - Shangri-La</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0f19;
            position: fixed;
            top: 0;
            left: 0;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #111827;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <!-- Asegúrate de que el script principal cargue como módulo -->
    <script type="module" src="js/engine/gameLoop.js"></script>
</body>
</html>
